# Example custom-view template, delivered as a ConfigMap.
#
# Apply it to a cluster and the Explorer side-nav gains a "Custom Views" group with
# these pages — no rebuild, no reload of the app bundle. This is the resource an
# operator (or our Claude client) would create.
#
#   kubectl apply -f example-custom-view.configmap.yaml
#
# ...or paste it into the Dashboard's "Import YAML". Then re-enter the cluster (the
# engine loads templates during cluster load) to see the pages.
#
# The label templates.rancher.io/custom-view: "true" is what the engine looks for.
# The template itself is JSON in data.template (a JSON string, since ConfigMap data
# values are strings).
#
# nav controls WHERE the pages appear in the Explorer side-nav:
#   nav.group      - group key. Omit for the default "Custom Views" group; use "root"
#                    to make the pages top-level nav items (no group header).
#   nav.groupLabel - human label shown for a custom group.
#   nav.weight     - group ordering (higher = higher up).
# Here the pages nest under a "Lists" parent group:  Lists > Compute, Networking.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-view-ops
  namespace: default
  labels:
    templates.rancher.io/custom-view: "true"
data:
  template: |
    {
      "apiVersion": "templates.rancher.io/v1",
      "kind": "CustomView",
      "metadata": { "id": "ops", "name": "Ops", "icon": "compass" },
      "nav": { "group": "lists", "groupLabel": "Lists", "weight": 60 },
      "pages": [
        {
          "id": "overview",
          "name": "Overview",
          "layout": "list",
          "widgets": [
            {
              "type": "overview",
              "title": "Workloads",
              "resources": [
                "pod",
                "apps.deployment",
                "apps.daemonset",
                "apps.statefulset",
                "batch.job",
                "batch.cronjob"
              ]
            },
            {
              "type": "overview",
              "title": "Networking",
              "resources": ["service", "networking.k8s.io.ingress"]
            }
          ]
        },
        {
          "id": "storage-overview",
          "name": "Storage",
          "layout": "list",
          "widgets": [
            {
              "type": "overview",
              "title": "Storage",
              "resources": [
                "persistentvolume",
                "persistentvolumeclaim",
                "storage.k8s.io.storageclass",
                "configmap",
                "secret"
              ]
            }
          ]
        },
        {
          "id": "compute",
          "name": "Compute",
          "layout": "list",
          "widgets": [
            {
              "type": "resourceList",
              "resource": "pod",
              "title": "Running Pods",
              "columns": [
                "state",
                "name",
                "namespace",
                { "name": "node", "value": "spec.nodeName", "label": "Node", "sort": "spec.nodeName" },
                "age"
              ],
              "filters": { "fieldMatch": { "status.phase": "Running" } }
            },
            { "type": "resourceList", "resource": "apps.deployment", "title": "Deployments" },
            {
              "type": "resourceList",
              "resource": "pod",
              "title": "kube-system Pods",
              "filters": { "namespaces": ["kube-system"] }
            }
          ]
        },
        {
          "id": "networking",
          "name": "Networking",
          "layout": "list",
          "widgets": [
            { "type": "resourceList", "resource": "service", "title": "Services" },
            { "type": "resourceList", "resource": "networking.k8s.io.ingress", "title": "Ingresses" }
          ]
        }
      ]
    }
